name: flutter_incall_manager
description: Flutter plugin for handling media routes, sensors, and events during audio/video calls.
version: 4.2.1
homepage: https://github.com/react-native-webrtc/react-native-incall-manager

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterInCallManagerPlugin
      android:
        package: com.zxcpoiu.incallmanager.flutter
        pluginClass: FlutterInCallManagerPlugin
